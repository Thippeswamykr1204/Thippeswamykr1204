<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="50%" stop-color="#060c1c"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- animated conic-style border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="25%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="round"><rect x="2" y="2" width="1196" height="296" rx="18"/></clipPath>
  </defs>

  <!-- animated glowing border -->
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none"
        stroke="url(#borderGrad)" stroke-width="2" opacity="0.9"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none"
        stroke="#3b82f6" stroke-width="4" opacity="0.15" filter="blur(2px)">
    <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>

    <!-- diagonal sheen sweep -->
    <rect x="-400" y="0" width="300" height="300" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-400;1400" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- subtle grid dots -->
    <g opacity="0.12">
      <circle cx="60" cy="40" r="1.2" fill="#60a5fa"/>
      <circle cx="140" cy="60" r="1.2" fill="#60a5fa"/>
      <circle cx="1000" cy="40" r="1.2" fill="#60a5fa"/>
      <circle cx="1080" cy="70" r="1.2" fill="#60a5fa"/>
    </g>

    <!-- animated flowing wave lines, bottom-right -->
    <g stroke-width="1.4" fill="none" opacity="0.75">
      <path d="M650,260 C820,180 950,240 1080,150 C1150,105 1180,120 1220,90" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="6s" repeatCount="indefinite"
          values="M650,260 C820,180 950,240 1080,150 C1150,105 1180,120 1220,90;
                  M650,255 C830,200 940,210 1080,170 C1150,130 1180,100 1220,80;
                  M650,260 C820,180 950,240 1080,150 C1150,105 1180,120 1220,90"/>
      </path>
      <path d="M680,275 C850,205 970,255 1090,175 C1155,130 1180,140 1220,115" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="M680,275 C850,205 970,255 1090,175 C1155,130 1180,140 1220,115;
                  M680,270 C860,220 960,225 1090,190 C1155,150 1180,120 1220,105;
                  M680,275 C850,205 970,255 1090,175 C1155,130 1180,140 1220,115"/>
      </path>
      <path d="M700,290 C880,225 990,270 1100,200 C1160,160 1185,165 1220,145" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M700,290 C880,225 990,270 1100,200 C1160,160 1185,165 1220,145;
                  M700,285 C890,240 980,245 1100,215 C1160,180 1185,150 1220,135;
                  M700,290 C880,225 990,270 1100,200 C1160,160 1185,165 1220,145"/>
      </path>
      <path d="M720,300 C900,245 1010,285 1110,225 C1165,190 1190,190 1220,170" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="9s" repeatCount="indefinite"
          values="M720,300 C900,245 1010,285 1110,225 C1165,190 1190,190 1220,170;
                  M720,296 C910,258 1000,265 1110,238 C1165,205 1190,175 1220,162;
                  M720,300 C900,245 1010,285 1110,225 C1165,190 1190,190 1220,170"/>
      </path>
      <path d="M740,300 C920,262 1030,298 1120,248 C1170,215 1195,212 1220,195" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
          values="M740,300 C920,262 1030,298 1120,248 C1170,215 1195,212 1220,195;
                  M740,298 C930,272 1020,280 1120,258 C1170,228 1195,200 1220,188;
                  M740,300 C920,262 1030,298 1120,248 C1170,215 1195,212 1220,195"/>
      </path>
    </g>

    <!-- pulsing dots traveling along lines -->
    <circle r="3" fill="#60a5fa">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M650,260 C820,180 950,240 1080,150 C1150,105 1180,120 1220,90"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#a855f7">
      <animateMotion dur="8s" repeatCount="indefinite" begin="1.5s"
        path="M700,290 C880,225 990,270 1100,200 C1160,160 1185,165 1220,145"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>

    <!-- text block, fades/rises in on load -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,14; 0,0" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>

      <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="url(#nameGrad)">
        THIPPESWAMY <tspan fill="#2563eb">K R</tspan>
      </text>

      <line x1="80" y1="178" x2="620" y2="178" stroke="#2563eb" stroke-width="2" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </line>
      <circle cx="80" cy="178" r="3" fill="#60a5fa">
        <animateMotion dur="3s" repeatCount="indefinite" path="M0,0 L540,0 L0,0"/>
      </circle>

      <text x="80" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="6" fill="#cbd5e1">
        FULL STACK DEVELOPER
      </text>

      <text x="80" y="255" font-family="Consolas, monospace" font-size="17" fill="#93c5fd">
        &lt;/&gt;
      </text>
      <text x="115" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e2e8f0">
        Code. Build. Deploy. <tspan fill="#3b82f6">Repeat.</tspan>
      </text>
    </g>
  </g>
</svg>
