<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="50%" stop-color="#060c1c"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bfdbfe"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="krGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pillFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <clipPath id="round"><rect x="2" y="2" width="1196" height="296" rx="18"/></clipPath>
  </defs>

  <!-- animated glowing border -->
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none"
        stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.95"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none"
        stroke="#a855f7" stroke-width="5" opacity="0.15" filter="blur(2px)">
    <animate attributeName="opacity" values="0.08;0.3;0.08" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>

    <!-- star flecks, dimmed so they don't compete with hero text -->
    <g fill="#93c5fd" opacity="0.5">
      <circle cx="120" cy="40" r="1.4" opacity="0.5"/>
      <circle cx="85" cy="65" r="1" opacity="0.35"/>
      <circle cx="1050" cy="42" r="1.2" opacity="0.4"/>
      <circle cx="1120" cy="70" r="1" opacity="0.3"/>
      <circle cx="990" cy="35" r="1.1" opacity="0.35">
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- dotted grid, bottom-left, dimmed -->
    <g fill="#60a5fa" opacity="0.16">
      <circle cx="55" cy="255" r="1.6"/>
      <circle cx="78" cy="255" r="1.6"/>
      <circle cx="101" cy="255" r="1.6"/>
      <circle cx="55" cy="272" r="1.6"/>
      <circle cx="78" cy="272" r="1.6"/>
      <circle cx="101" cy="272" r="1.6"/>
    </g>

    <!-- diagonal sheen sweep -->
    <rect x="-400" y="0" width="300" height="300" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-400;1400" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- animated flowing wave lines, bottom-right, thinner + dimmer -->
    <g stroke-width="1" fill="none" opacity="0.35">
      <path d="M780,270 C900,215 1000,255 1090,190 C1150,150 1180,155 1220,130" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="6s" repeatCount="indefinite"
          values="M780,270 C900,215 1000,255 1090,190 C1150,150 1180,155 1220,130;
                  M780,265 C910,230 990,225 1090,205 C1150,170 1180,140 1220,120;
                  M780,270 C900,215 1000,255 1090,190 C1150,150 1180,155 1220,130"/>
      </path>
      <path d="M800,285 C930,235 1020,270 1100,215 C1155,175 1185,175 1220,155" stroke="url(#lineGrad)">
        <animate attributeName="d" dur="7.5s" repeatCount="indefinite"
          values="M800,285 C930,235 1020,270 1100,215 C1155,175 1185,175 1220,155;
                  M800,280 C940,248 1010,240 1100,228 C1155,192 1185,162 1220,148;
                  M800,285 C930,235 1020,270 1100,215 C1155,175 1185,175 1220,155"/>
      </path>
    </g>

    <!-- glowing dots traveling along lines -->
    <circle r="3" fill="#60a5fa" opacity="0.7">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M780,270 C900,215 1000,255 1090,190 C1150,150 1180,155 1220,130"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- HERO CONTENT: centered, ordered for a clear 3-second read -->
    <g text-anchor="middle">
      <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>

      <!-- 1. Name -->
      <text x="600" y="98" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900"
            letter-spacing="1.5" fill="url(#nameGrad)">
        THIPPESWAMY <tspan fill="url(#krGrad)">K R</tspan>
      </text>

      <!-- 2. Subtitle -->
      <text x="600" y="134" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1" fill="#94A3B8">
        Full-Stack Developer • AI/ML Graduate (2026)
        <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
      </text>

      <!-- 3. Social links: glassmorphism pills, centered -->
      <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">
        <a xlink:href="https://thippeswamykr1204.github.io/Portfolio" target="_blank">
          <rect x="346" y="175" width="130" height="32" rx="16" fill="url(#pillFill)" stroke="#3B82F6" stroke-opacity="0.35"/>
          <text x="411" y="196" fill="#F8FAFC">Portfolio</text>
        </a>
        <a xlink:href="mailto:kollithippeswamy1204@gmail.com" target="_blank">
          <rect x="492" y="175" width="100" height="32" rx="16" fill="url(#pillFill)" stroke="#3B82F6" stroke-opacity="0.35"/>
          <text x="542" y="196" fill="#F8FAFC">Email</text>
        </a>
        <a xlink:href="https://linkedin.com/in/thippeswamy-kr" target="_blank">
          <rect x="608" y="175" width="120" height="32" rx="16" fill="url(#pillFill)" stroke="#3B82F6" stroke-opacity="0.35"/>
          <text x="668" y="196" fill="#F8FAFC">LinkedIn</text>
        </a>
      </g>

      <!-- 4. Typewriter section: cycling lines with blinking cursor -->
      <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#60a5fa">
        <text x="600" y="248" opacity="0">
          Building scalable full-stack applications
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.22;0.26" dur="12s" begin="0s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="248" opacity="0">
          React • Next.js • Node.js • TypeScript
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.22;0.26" dur="12s" begin="3s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="248" opacity="0">
          AI-powered web applications
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.22;0.26" dur="12s" begin="6s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="248" opacity="0">
          Open to Software Engineer opportunities
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.22;0.26" dur="12s" begin="9s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>
  </g>
</svg>
